<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Read a Nutrition Facts Label</title>
<style>
  body { margin: 0; background: #FFFDF7; color: #1B1B1B; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: #1F6F43; color: #fff; padding: 24px 20px; text-align: center; }
  header p { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .14em; color: #FFD84D; }
  header h1 { margin: 0; font-size: 28px; line-height: 1.15; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 14px 40px; display: flex; flex-direction: column; gap: 28px; }
  figure { margin: 0; background: #fff; border: 1px solid #d9d4c7; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  figure a { display: block; }
  figure img { width: 100%; height: auto; display: block; }
  figcaption { padding: 10px 14px; font-size: 14px; color: #444; border-top: 1px solid #e6e1d4; }
  footer { text-align: center; font-size: 13px; color: #555; padding-bottom: 28px; }
</style>
</head>
<body>
<header>
  <p>NUTRITION FAIR TAKE-HOME</p>
  <h1>How to Read a Nutrition Facts Label</h1>
</header>
<main>
  <figure>
    <a href="label-guide.jpg"><img src="label-guide.jpg" alt="Color-coded Nutrition Facts label explaining serving size, calories, % Daily Value, nutrients to limit, nutrients to get enough of, and the footnote"></a>
    <figcaption>The label, section by section. Tap the image to zoom in.</figcaption>
  </figure>
</main>
<footer>Tip: take a screenshot to save this to your phone.</footer>
</body>
</html>
